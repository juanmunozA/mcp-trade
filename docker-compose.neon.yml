# Postgres en Neon en vez de en un contenedor.
#
#     docker compose -f docker-compose.yml -f docker-compose.neon.yml up -d
#
# (`arrancar.sh` / `arrancar.ps1` lo hacen solos cuando DB_MODE=neon)
#
# QUÉ AHORRA
# Un contenedor menos (~250 MB de RAM) y la carpeta `pgdata/`, que crece sin
# parar. En una máquina donde Ollama ya se come casi toda la memoria, eso es
# lo que puede decidir si el modelo cabe o se va a swap.
#
# QUÉ CUESTA
# Cada consulta sale a internet. Para este agente no importa: hace unas pocas
# escrituras por mercado, no está en un bucle caliente. Pero si Neon no
# responde, el ciclo falla — a diferencia del contenedor, que está al lado.
#
# IMPORTANTE: usa el endpoint DIRECTO de Neon, no el `-pooler`. PgBouncer en
# modo transacción baraja conexiones y asyncpg revienta con «prepared
# statement already exists». El código lo detecta y desactiva la caché de
# statements, pero eso es un parche: re-planifica cada query.

services:
  # Fuera el contenedor de base de datos.
  postgres: !reset null

  agent:
    # `environment` gana sobre `env_file`, así que la URL local del compose
    # base taparía la de Neon. Se reemplaza explícitamente, y sin valor por
    # defecto: si falta, compose falla antes de levantar nada en vez de
    # arrancar callado contra un postgres que no existe.
    environment:
      DATABASE_URL: ${DATABASE_URL:?DB_MODE=neon exige DATABASE_URL en el .env}
    depends_on: !override
      ollama:
        condition: service_healthy

  n8n:
    depends_on: !reset null
    environment:
      # n8n pasa a SQLite dentro de ./n8n_data, que es un bind mount y
      # persiste. No se manda a Neon para no pedir cuatro variables más
      # (host, user, password, base) solo para guardar cinco workflows.
      DB_TYPE: sqlite
