<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torre de Control</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
:root{
  --ground:#F2F0EC;--surface:#fff;--surface-2:#FAF8F5;--surface-3:#F5F2ED;
  --ink:#14171C;--muted:#676C75;--faint:#9B9FA7;
  --line:#E1DDD6;--line-soft:#ECE8E2;
  --accent:#A85D30;--accent-soft:#F3E5DA;
  --ok:#3B7A5C;--ok-soft:#E2EFE8;
  --warn:#8A6A18;--warn-soft:#F5EBD2;
  --bad:#99392F;--bad-soft:#F6E1DE;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:9px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ground:#111317;--surface:#191C21;--surface-2:#1E2228;--surface-3:#232830;
  --ink:#E8E5DF;--muted:#8E9299;--faint:#686C73;
  --line:#272B33;--line-soft:#21252B;
  --accent:#D9895A;--accent-soft:#33241B;
  --ok:#5DA57E;--ok-soft:#1A2A22;
  --warn:#C9A244;--warn-soft:#2B2417;
  --bad:#D46A5F;--bad-soft:#2D1B19;
}}
:root[data-theme=dark]{
  --ground:#111317;--surface:#191C21;--surface-2:#1E2228;--surface-3:#232830;
  --ink:#E8E5DF;--muted:#8E9299;--faint:#686C73;
  --line:#272B33;--line-soft:#21252B;
  --accent:#D9895A;--accent-soft:#33241B;
  --ok:#5DA57E;--ok-soft:#1A2A22;
  --warn:#C9A244;--warn-soft:#2B2417;
  --bad:#D46A5F;--bad-soft:#2D1B19;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-inline:20px;padding-block:0 60px}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}

header{position:sticky;top:0;z-index:40;background:var(--ground);
  border-bottom:1px solid var(--line);margin-inline:-20px;padding:13px 20px 11px}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1{font-size:18.5px;font-weight:700;letter-spacing:-.018em;line-height:1.2}
.brand span{font-family:var(--mono);font-size:11px;color:var(--faint);display:block}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{font:500 12.5px/1.3 var(--sans);background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;
  transition:border-color .12s,color .12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.live{display:flex;align-items:center;gap:6px;font:400 11.5px var(--mono);
  color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--ok)}
.dot.warn{background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.dot.on{animation:lat 2.2s ease-in-out infinite}}
@keyframes lat{0%,100%{opacity:1}50%{opacity:.3}}

.key{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;
  padding:11px 14px;background:var(--warn-soft);border:1px solid var(--line);
  border-left:3px solid var(--warn);border-radius:var(--r)}
.key p{margin:0;font-size:13px;flex:1 1 280px}
.key input{font:400 12.5px var(--mono);background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:240px;max-width:100%}
.key input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.alarma{margin-top:14px;padding:12px 15px;border-radius:var(--r);
  background:var(--bad-soft);border:1px solid var(--bad)}
.alarma strong{font:600 12.5px var(--cond);letter-spacing:.06em;
  text-transform:uppercase;color:var(--bad)}
.alarma p{margin:3px 0 0;font-size:13.5px}

.grid{display:grid;gap:16px;margin-top:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(350px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line-soft);background:var(--surface-2);flex-wrap:wrap}
.card-h h2{font-size:14.5px;font-weight:600}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.name{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.name small{display:block;font:400 11px var(--mono);color:var(--faint)}

.chip{font:600 10.5px var(--cond);letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.mute{background:var(--surface);color:var(--muted);border-color:var(--line)}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

.tiles{display:grid;gap:1px;background:var(--line-soft);
  grid-template-columns:repeat(auto-fit,minmax(125px,1fr));
  border-bottom:1px solid var(--line-soft)}
.tile{background:var(--surface);padding:12px 14px 11px;min-width:0}
.lab{display:block;font:600 10px var(--cond);letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.val{display:block;font:500 20px/1.15 var(--mono);font-variant-numeric:tabular-nums;
  letter-spacing:-.025em;overflow-wrap:anywhere}
.val.sm{font-size:15.5px}
.val.bad{color:var(--bad)}.val.ok{color:var(--ok)}.val.warn{color:var(--warn)}
.sub2{display:block;font:400 10.5px var(--mono);color:var(--faint);margin-top:3px}
.mini{height:26px;margin-top:5px}

.rows{padding:5px 16px 13px}
.row{display:flex;gap:12px;align-items:baseline;padding:6.5px 0;
  border-bottom:1px solid var(--line-soft);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.row .v{margin-left:auto;text-align:right;font:500 12.5px var(--mono);
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row.bad .v{color:var(--bad)}.row.ok .v{color:var(--ok)}
.hdr{font:600 10px var(--cond);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:13px 0 3px}
.empty{font-size:13px;color:var(--muted);font-style:italic;padding:14px 16px;margin:0}

.fbar{display:flex;gap:5px;flex-wrap:wrap;padding:9px 16px;
  border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
.f{font:600 10.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);cursor:pointer}
.f[aria-pressed=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.f:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.feed{max-height:380px;overflow-y:auto;overscroll-behavior:contain}
.ev{display:flex;gap:10px;align-items:baseline;padding:6px 16px;
  border-bottom:1px solid var(--line-soft);font:400 12px var(--mono)}
.ev:last-child{border-bottom:0}
.ev .t{color:var(--faint);font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ev .kd{font:600 9.5px var(--cond);letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:3px;min-width:78px;text-align:center;white-space:nowrap}
.ev .m{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .x{color:var(--faint);font-size:10.5px;white-space:nowrap}
.ev .s{font:500 9.5px var(--cond);letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}
.kd.paso{background:var(--surface-3);color:var(--muted)}
.kd.ok{background:var(--ok-soft);color:var(--ok)}
.kd.error{background:var(--bad-soft);color:var(--bad)}
.kd.parada,.kd.rechazo{background:var(--warn-soft);color:var(--warn)}
.kd.orden,.kd.propuesta{background:var(--accent-soft);color:var(--accent)}
.kd.explorar{background:var(--surface-3);color:var(--ink)}

.mk{display:block;width:100%;text-align:left;background:var(--surface);border:0;
  border-bottom:1px solid var(--line-soft);padding:11px 16px;cursor:pointer;
  font:400 13px var(--sans);color:var(--ink)}
.mk:hover{background:var(--surface-2)}
.mk[aria-expanded=true]{background:var(--surface-3)}
.mk:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mk-t{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mk-q{font-weight:500;flex:1 1 280px;min-width:0}
.mk-n{font:500 12px var(--mono);color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.mk-n b{color:var(--ink)}
.bar{display:flex;height:5px;border-radius:3px;overflow:hidden;
  background:var(--line-soft);margin-top:8px}
.bar i{display:block;height:100%}
.det{background:var(--surface-2);border-bottom:1px solid var(--line-soft);padding:0 16px 16px}
.det-g{display:grid;gap:14px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);padding-top:13px}
@media (max-width:700px){.det-g{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:11px}
.pane h3{font:600 10px var(--cond);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}
.chart{width:100%;height:210px}
.why{margin:11px 0 0;padding:9px 12px;font-size:12.5px;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--warn);border-radius:6px}
.why b{color:var(--ink)}

.dg{display:grid;gap:1px;background:var(--line-soft);
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.dcell{background:var(--surface);padding:12px 16px 14px;min-width:0}
.dcell h3{font:600 10px var(--cond);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px}
.dchart{width:100%;height:150px}
footer{margin-top:24px;font-size:12px;color:var(--faint);text-align:center;
  padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/preact/10.25.4/preact.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/preact/10.25.4/hooks.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/6.1.0/echarts.min.js"></script>
<script>
"use strict";
var AGENTES = window.__AGENTES__ || [];
var h = preact.h, render = preact.render;
var useState = preactHooks.useState, useEffect = preactHooks.useEffect,
    useRef = preactHooks.useRef, useCallback = preactHooks.useCallback,
    useMemo = preactHooks.useMemo;
var html = htm.bind(h);

var f = {
  num: function(v, d){ d = d || 0;
    return (v == null || v === "" || isNaN(+v)) ? "—"
      : (+v).toLocaleString("es", {minimumFractionDigits:d, maximumFractionDigits:d}); },
  usd: function(v){ return (v == null || v === "" || isNaN(+v)) ? "—"
      : "$" + (+v).toLocaleString("es", {minimumFractionDigits:2, maximumFractionDigits:2}); },
  pct: function(v){ return (v == null || isNaN(+v)) ? "—" : (+v*100).toFixed(1) + "%"; },
  dur: function(s){ if (s == null) return "—"; s = Math.floor(s);
    if (s < 60) return s + "s";
    if (s < 3600) return Math.floor(s/60) + "m " + (s%60) + "s";
    return Math.floor(s/3600) + "h " + Math.floor(s%3600/60) + "m"; },
  hora: function(x){ if (!x) return "—"; var d = new Date(x);
    return isNaN(d.getTime()) ? "—"
      : d.toLocaleString("es", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}); },
  hms: function(x){ var d = new Date(x);
    return isNaN(d.getTime()) ? "--:--:--" : d.toLocaleTimeString("es", {hour12:false}); }
};

function css(v, fb){
  try { return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || fb; }
  catch(e){ return fb; }
}

/* ECharts como componente: una instancia por nodo, destruida al
   desmontar. Sin el dispose cada refresco dejaria un grafico huerfano
   escuchando resize, y la memoria crece sola toda la noche. */
function Chart(props){
  var el = useRef(null), inst = useRef(null);
  useEffect(function(){
    if (!el.current || !window.echarts) return;
    inst.current = echarts.init(el.current, null, {renderer:"svg"});
    if (props.option) inst.current.setOption(props.option(), true);
    var ro = new ResizeObserver(function(){ if (inst.current) inst.current.resize(); });
    ro.observe(el.current);
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var retema = function(){ if (inst.current && props.option) inst.current.setOption(props.option(), true); };
    if (mq.addEventListener) mq.addEventListener("change", retema);
    return function(){
      ro.disconnect();
      if (mq.removeEventListener) mq.removeEventListener("change", retema);
      if (inst.current) { inst.current.dispose(); inst.current = null; }
    };
  }, []);
  useEffect(function(){
    if (inst.current && props.option) inst.current.setOption(props.option(), true);
  }, [props.dep]);
  return html`<div ref=${el} class=${props.class || "chart"}></div>`;
}

function tema(){
  return { ink: css("--ink","#222"), muted: css("--muted","#777"),
           line: css("--line","#ddd"), acc: css("--accent","#a85d30"),
           surf: css("--surface","#fff"), mono: "IBM Plex Mono, monospace" };
}

/* Escala 0..1 fija porque es una probabilidad: reescalar al min/max
   haria ver como sismo un mercado que se movio dos centavos. */
function opcionPrecio(puntos, marca){
  var c = tema();
  var datos = puntos.map(function(p){ return [p.t*1000, p.p]; });
  return {
    animation:false,
    grid:{left:42, right:14, top:16, bottom:26},
    tooltip:{trigger:"axis", backgroundColor:c.surf, borderColor:c.line,
      textStyle:{color:c.ink, fontFamily:c.mono, fontSize:11},
      axisPointer:{type:"cross", label:{backgroundColor:c.muted}},
      valueFormatter:function(v){ return (v*100).toFixed(1) + "%"; }},
    xAxis:{type:"time", axisLine:{lineStyle:{color:c.line}},
      axisLabel:{color:c.muted, fontFamily:c.mono, fontSize:10}, splitLine:{show:false}},
    yAxis:{type:"value", min:0, max:1,
      axisLabel:{color:c.muted, fontFamily:c.mono, fontSize:10,
        formatter:function(v){ return v.toFixed(2); }},
      splitLine:{lineStyle:{color:c.line}}},
    dataZoom:[{type:"inside"}],
    series:[{
      type:"line", data:datos, showSymbol:false,
      lineStyle:{color:c.ink, width:1.8},
      areaStyle:{color:c.muted, opacity:0.10},
      markLine: marca == null ? undefined : {
        silent:true, symbol:"none",
        label:{formatter:"agente", color:c.acc, fontFamily:c.mono, fontSize:10,
          position:"insideStartTop"},
        lineStyle:{color:c.acc, type:"dashed", width:1.5},
        data:[{yAxis:marca}]}
    }]
  };
}

function opcionBarras(pares, colorear){
  var c = tema();
  return {
    animation:false,
    grid:{left:4, right:34, top:6, bottom:4, containLabel:true},
    tooltip:{trigger:"item", backgroundColor:c.surf, borderColor:c.line,
      textStyle:{color:c.ink, fontFamily:c.mono, fontSize:11}},
    xAxis:{type:"value", show:false},
    yAxis:{type:"category", inverse:true,
      data:pares.map(function(x){ return x[0]; }),
      axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:c.muted, fontSize:10.5, fontFamily:"IBM Plex Sans"}},
    series:[{type:"bar", barWidth:"58%",
      data:pares.map(function(x){
        return {value:x[1], itemStyle:{color: colorear ? colorear(x[0]) : c.acc}}; }),
      itemStyle:{borderRadius:[0,3,3,0]},
      label:{show:true, position:"right", color:c.muted, fontFamily:c.mono, fontSize:10}}]
  };
}

function opcionMini(vals){
  var c = tema();
  return {
    animation:false, grid:{left:0, right:0, top:2, bottom:2},
    xAxis:{type:"category", show:false, data:vals.map(function(_,i){ return i; })},
    yAxis:{type:"value", show:false, scale:true},
    series:[{type:"line", data:vals, showSymbol:false, smooth:true,
      lineStyle:{color:c.acc, width:1.6}, areaStyle:{color:c.acc, opacity:0.12}}]
  };
}

function pedir(url, ruta, token, ms){
  var ctl = new AbortController();
  var t = setTimeout(function(){ ctl.abort(); }, ms || 95000);
  return fetch(url + ruta, {headers: token ? {Authorization:"Bearer "+token} : {},
      signal:ctl.signal, cache:"no-store"})
    .then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if (r.status === 401) return {_err:"token invalido"};
        if (r.status === 403) return {_err:"solo lectura"};
        if (!r.ok && r.status !== 503) return {_err:"HTTP " + r.status};
        return j;
      });
    })
    .catch(function(e){
      return {_err:(e && e.name === "AbortError") ? "sin respuesta" : "no se pudo conectar"};
    })
    .then(function(j){ clearTimeout(t); return j; });
}

function useAgentes(token){
  var ini = {};
  AGENTES.forEach(function(a){ ini[a.id] = {cargando:true, desde:Date.now()}; });
  var s1 = useState(ini), datos = s1[0], setDatos = s1[1];
  var s2 = useState({}), hist = s2[0], setHist = s2[1];
  var s3 = useState(false), ro = s3[0], setRo = s3[1];

  var leer = useCallback(function(){
    AGENTES.forEach(function(a){
      setDatos(function(d){
        var n = Object.assign({}, d);
        n[a.id] = Object.assign({}, d[a.id], {cargando:true,
          desde:(d[a.id] && d[a.id].desde) || Date.now()});
        return n;
      });
      Promise.all([
        pedir(a.url, "/health", null),
        token ? pedir(a.url, "/report", token) : Promise.resolve(null),
        token ? pedir(a.url, "/geo", token) : Promise.resolve(null),
        token ? pedir(a.url, "/activity?n=16", token) : Promise.resolve(null),
        token ? pedir(a.url, "/diagnostico", token) : Promise.resolve(null),
        token ? pedir(a.url, "/acceso", token) : Promise.resolve(null)
      ]).then(function(r){
        var ok = function(x){ return (x && !x._err) ? x : null; };
        if (r[5] && r[5].escribe === false) setRo(true);
        var hh = ok(r[0]);
        if (hh) setHist(function(H){
          var n = Object.assign({}, H), cur = (n[a.id] || []).slice(-59);
          var v = hh.budget ? hh.budget.pct_consumido
                : (hh.inventario ? Math.abs(hh.inventario.worst_imbalance) : null);
          if (v != null && !isNaN(+v)) cur.push(+v);
          n[a.id] = cur; return n;
        });
        setDatos(function(d){
          var n = Object.assign({}, d);
          n[a.id] = {cargando:false, desde:0,
            err:(r[0] && r[0]._err) || null, health:hh,
            report:ok(r[1]), rerr:(r[1] && r[1]._err) || null,
            geo:ok(r[2]), act:ok(r[3]), diag:ok(r[4])};
          return n;
        });
      });
    });
  }, [token]);

  return {datos:datos, hist:hist, ro:ro, leer:leer};
}

/* SSE por fetch y no EventSource: EventSource no manda cabeceras, asi
   que el token acabaria en la URL y en los logs del proxy. */
function useStream(token, onEvento){
  var s = useState({}), estado = s[0], setEstado = s[1];
  useEffect(function(){
    if (!token) { setEstado({}); return; }
    var vivo = true, ctls = [];
    AGENTES.forEach(function(a){
      var espera = 1000;
      function abrir(){
        if (!vivo) return;
        var ctl = new AbortController(); ctls.push(ctl);
        fetch(a.url + "/stream?n=30", {headers:{Authorization:"Bearer "+token}, signal:ctl.signal})
        .then(function(r){
          if (!r.ok || !r.body) throw new Error("HTTP " + r.status);
          espera = 1000;
          setEstado(function(e){ var n = Object.assign({}, e); n[a.id] = "ok"; return n; });
          var rd = r.body.getReader(), dec = new TextDecoder(), buf = "";
          function leer(){
            return rd.read().then(function(x){
              if (x.done) throw new Error("cerrado");
              buf += dec.decode(x.value, {stream:true});
              var partes = buf.split("\n\n"); buf = partes.pop();
              partes.forEach(function(bl){
                var d = bl.split("\n").filter(function(l){ return l.indexOf("data: ") === 0; });
                if (!d.length) return;
                try {
                  var ev = JSON.parse(d[0].slice(6));
                  ev._src = a.nombre; ev._aid = a.id;
                  onEvento(ev);
                } catch(e){}
              });
              return leer();
            });
          }
          return leer();
        })
        .catch(function(){
          if (!vivo) return;
          setEstado(function(e){ var n = Object.assign({}, e); n[a.id] = "off"; return n; });
          setTimeout(abrir, espera);
          espera = Math.min(espera * 2, 30000);
        });
      }
      abrir();
    });
    return function(){ vivo = false; ctls.forEach(function(c){ try { c.abort(); } catch(e){} }); };
  }, [token]);
  return estado;
}

function TarjetaAgente(p){

    chips.push(html`<span class=${"chip " + (hh.mode === "live" ? "warn" : "mute")}>${hh.mode || "?"}</span>`);
    chips.push(html`<span class="chip mute">${f.dur(hh.uptime_s)}</span>`);
    if (p.sse === "ok") chips.push(html`<span class="chip acc">stream</span>`);

  var tiles, rows = [];

      <${Tile} lab="Desbalance" val=${inv ? f.num(inv.worst_imbalance,1) : "—"}

      <${Tile} lab="Costo del par"

    if (r) rows = [

      ["Ordenes", f.num(r.n_orders), ""],
      ["Fills", f.num(r.n_fills), ""],
      ["Tasa de fill", r.fill_rate == null ? "—" : f.pct(r.fill_rate), ""],
      ["Slippage medio", r.avg_slippage_bps == null ? "—" : f.num(r.avg_slippage_bps,1) + " bps", ""],

      <${Tile} lab="Gemini" val=${b ? f.num(b.gemini_restantes) : "—"} sub="llamadas libres hoy" />

    if (r) rows = [

      ["Brier del mercado", r.n_resolved ? f.num(r.brier_market,4) : "—", ""],
      ["Ventaja sobre el precio", r.skill_vs_market == null ? "—" : f.num(r.skill_vs_market,4), ""],
      ["Le gana al mercado", r.beat_market_rate == null ? "—" : f.pct(r.beat_market_rate), ""],
      ["PnL", f.usd(r.pnl_usd), ""],

  return html`<article class="card">

var TIPOS = ["todo","error","rechazo","orden","propuesta","paso","ok","parada","explorar"];

function Feed(p){

    var L = filtro === "todo" ? p.eventos
      : p.eventos.filter(function(e){ return e.kind === filtro; });

  }, [p.eventos, filtro]);

  useEffect(function(){
    if (caja.current && pegado.current) caja.current.scrollTop = caja.current.scrollHeight;
  }, [vis.length]);

  var conectados = AGENTES.filter(function(a){ return p.sse[a.id] === "ok"; }).length;

  return html`<section class="card">
    <div class="card-h">
      <h2>En vivo</h2><span class="sub">cada paso, cuando ocurre</span>

        <span class="live">
          <span class=${"dot " + (conectados === AGENTES.length && conectados ? "on"
            : conectados ? "warn" : "")}></span>

            : conectados === AGENTES.length ? "conectado"

        <span class="live">${p.eventos.length} eventos</span>
      </div>
    </div>
    <div class="fbar">
      ${TIPOS.map(function(t){
        var n = t === "todo" ? p.eventos.length
          : p.eventos.filter(function(e){ return e.kind === t; }).length;
        if (t !== "todo" && !n) return null;
        return html`<button class="f" type="button" key=${t} aria-pressed=${filtro === t}
          onClick=${function(){ setFiltro(t); }}>${t}${n ? " · " + n : ""}</button>`;
      })}
    </div>
    <div class="feed" ref=${caja}
      onScroll=${function(e){
        var el = e.target;
        pegado.current = el.scrollHeight - el.scrollTop - el.clientHeight < 42;
      }}>
      ${!vis.length
        ? html`<p class="empty">${p.token
            ? "Conectado. Los eventos aparecen apenas el agente hace algo: el ciclo de pronostico corre cada 4 h, el de sets cada pocos segundos."
            : "Pega el token para ver el flujo en vivo."}</p>`
        : vis.map(function(e){
            var d = e.datos || {}, x = "";
            if (d.p != null) x = f.pct(d.p) + " vs " + f.pct(d.precio);
            else if (d.usd != null) x = f.usd(d.usd);
            else if (d.combinado != null) x = "par " + f.num(d.combinado,4);
            else if (d.elegidos != null) x = d.elegidos + " de " + d.crudos;
            else if (d.ms != null) x = d.ms + " ms";
            return html`<div class="ev" key=${e._aid + ":" + e.id}>
              <span class="t">${f.hms(e.ts)}</span>
              <span class=${"kd " + e.kind}>${e.kind}</span>
              <span class="m">${e.msg}</span>
              ${x ? html`<span class="x">${x}</span>` : null}
              <span class="s">${e._src}</span>
            </div>`;
          })}
    </div>
  </section>`;
}

function Mercados(p){
  var s1 = useState(null), abierto = s1[0], setAbierto = s1[1];
  var s2 = useState({}), precios = s2[0], setPrecios = s2[1];

  function abrir(clave, a, it){
    if (abierto === clave) { setAbierto(null); return; }
    setAbierto(clave);
    var tok = it.token_yes || it.token_up;
    if (!tok || precios[tok] !== undefined) return;
    setPrecios(function(P){ var n = Object.assign({}, P); n[tok] = null; return n; });
    pedir(a.url, "/precio?rango=1w&token=" + encodeURIComponent(tok), p.token, 60000)
      .then(function(r){
        setPrecios(function(P){
          var n = Object.assign({}, P);
          n[tok] = (r && !r._err) ? r : {error:(r && r._err) || "sin datos"};
          return n;
        });
      });
  }

  var filas = [];
  AGENTES.forEach(function(a){
    var d = p.datos[a.id], items = d && d.act && d.act.items;
    if (!items || !items.length) return;
    filas.push(html`<div class="hdr" style="padding:12px 16px 3px" key=${a.id + ":h"}>${a.nombre}</div>`);
    items.forEach(function(it, i){
      var clave = a.id + ":" + i, esta = abierto === clave;
      var pron = it.p_calibrated != null;
      var pp = pron ? +it.p_calibrated : null, mm = pron ? +it.p_market : null;
      var estado = it.outcome === true ? html`<span class="chip ok">resolvio SI</span>`
        : it.outcome === false ? html`<span class="chip bad">resolvio NO</span>`
        : (it.action && it.action !== "PASS") ? html`<span class="chip warn">${it.action}</span>`
        : (it.imbalance && Math.abs(it.imbalance) > 0) ? html`<span class="chip warn">desbalanceado</span>`
        : null;
      var tok = it.token_yes || it.token_up, pd = precios[tok];

      filas.push(html`<button class="mk" type="button" key=${clave} aria-expanded=${esta}
          onClick=${function(){ abrir(clave, a, it); }}>
        <span class="mk-t">
          <span class="mk-q">${it.question || it.slug || "(sin nombre)"}</span>
          ${estado}
          <span class="mk-n">${pron
            ? html`<b>${f.pct(pp)}</b> agente · ${f.pct(mm)} mercado`
            : html`<b>${f.num(it.shares_up,0)}</b> up / ${f.num(it.shares_down,0)} down`}</span>
        </span>
        ${pron ? html`<span class="bar">
          <i style=${"width:" + (pp*100).toFixed(1) + "%;background:var(--accent)"}></i>
          <i style=${"width:" + Math.max(0,(mm-pp)*100).toFixed(1) + "%;background:var(--muted);opacity:.4"}></i>
        </span>` : null}
      </button>`);

      if (!esta) return;
      var det = pron
        ? [["Categoria", it.category || "—"], ["Accion", it.action || "—"],
           ["Confianza", it.confidence || "—"],
           ["Divergencia", (pp != null && mm != null) ? ((pp-mm >= 0 ? "+" : "") + f.num(pp-mm,3)) : "—"],
           ["Cierra", it.end_date ? f.hora(it.end_date) : "—"],
           ["Pronosticado", f.hora(it.ts)]]
        : [["Shares UP", f.num(it.shares_up,1) + " @ " + f.num(it.avg_cost_up,3)],
           ["Shares DOWN", f.num(it.shares_down,1) + " @ " + f.num(it.avg_cost_down,3)],
           ["Pares", f.num(it.paired,1)], ["Desbalance", f.num(it.imbalance,1)],
           ["Edge trabado", f.usd(it.locked_edge)]];

      filas.push(html`<div class="det" key=${clave + ":d"}><div class="det-g">
        <div class="pane">
          <h3>Precio del mercado · ultima semana</h3>
          ${pd === undefined || pd === null ? html`<p class="empty">Cargando precio...</p>`
            : pd.error ? html`<p class="empty">${pd.error}</p>`
            : (!pd.puntos || pd.puntos.length < 2) ? html`<p class="empty">Sin historial todavia.</p>`
            : html`<${Chart} dep=${tok + ":" + pd.puntos.length}
                option=${function(){ return opcionPrecio(pd.puntos, pp); }} />`}
        </div>
        <div>
          ${det.map(function(x){ return html`<${Row} k=${x[0]} v=${x[1]} />`; })}
          ${it.pass_reason
            ? html`<p class="why"><b>Por que no opero:</b> ${it.pass_reason}</p>` : null}
        </div>
      </div></div>`);
    });
  });

  return html`<section class="card">
    <div class="card-h"><h2>En que esta trabajando</h2>
      <span class="sub">toca un mercado para ver como se mueve</span></div>
    ${filas.length ? filas
      : html`<p class="empty">${p.token ? "Todavia no hay actividad registrada."
        : "Pega el token para ver los mercados."}</p>`}
  </section>`;
}

        <h3>${a.nombre} · por que no opero</h3>
        <${Chart} class="dchart" dep=${JSON.stringify(pass)}
          option=${function(){ return opcionBarras(pass, function(m){
            return (m === "se rompio" || m.indexOf("rompi") >= 0 || m === "sin modelo")
              ? css("--bad","#933")
              : (m.indexOf("limpia") >= 0 ? css("--ok","#396") : css("--warn","#a81")); }); }} />
      </div>`);
      var ens = (d.ensemble || []).map(function(x){
        return [(x.n_models == null ? "?" : x.n_models) + " modelo(s)", x.n]; });

        <h3>${a.nombre} · cuantos modelos votaron</h3>

      var cats = (d.categorias || []).slice(0,9).map(function(x){

        <h3>${a.nombre} · reparto por categoria</h3>
        <${Chart} class="dchart" dep=${JSON.stringify(cats)}

      var r = d.resumen || {};

        <${Row} k="Sesgo medio" cls=${r.sesgo != null && Math.abs(r.sesgo) > 0.05 ? "bad" : "ok"}
          v=${r.sesgo == null ? "—" : (r.sesgo >= 0 ? "+" : "") + f.num(r.sesgo,3)} />
        <${Row} k="Por debajo del precio" v=${f.num(r.debajo) + " de " + f.num(r.n)} />
        <${Row} k="Divergencia > 30 pts" cls=${r.lejos > 0 ? "bad" : "ok"} v=${f.num(r.lejos)} />
        <${Row} k="Pronosticos por mercado" cls=${r.por_mercado > 3 ? "bad" : "ok"}
          v=${f.num(r.por_mercado,2)} />
        <${Row} k="Mercados distintos" v=${f.num(r.mercados)} />
      </div>`);
    } else if (d.inventario) {
      var rk = d.riesgo || {};
      cel.push(html`<div class="dcell" key=${a.id + ":k"}>
        <h3>${a.nombre} · riesgo y datos</h3>
        ${Object.keys(rk).filter(function(k){ return rk[k] === null || typeof rk[k] !== "object"; })
          .slice(0,8).map(function(k){
            return html`<${Row} key=${k} k=${k.replace(/_/g," ")}
              v=${typeof rk[k] === "number" ? f.num(rk[k],2) : String(rk[k])} />`; })}
        <${Row} k="eventos emitidos" v=${f.num(d.eventos)} />
        <${Row} k="ultimo libro" v=${d.ultimo_dato ? f.hora(d.ultimo_dato) : "—"} />
      </div>`);
    }
  });
  return html`<section class="card">
    <div class="card-h"><h2>Diagnostico</h2>
      <span class="sub">en que se va el trabajo y que se rompe</span></div>
    ${cel.length ? html`<div class="dg">${cel}</div>`
      : html`<p class="empty">${p.token ? "Sin diagnostico todavia."
        : "Pega el token para ver el diagnostico."}</p>`}
  </section>`;
}

function Geo(p){

function App(){
  var ini = ""; try { ini = localStorage.getItem("mcp_token") || ""; } catch(e){}
  var s1 = useState(ini), token = s1[0], setToken = s1[1];
  var s2 = useState(ini), borr = s2[0], setBorr = s2[1];
  var s3 = useState(true), auto = s3[0], setAuto = s3[1];
  var s4 = useState(15), cuenta = s4[0], setCuenta = s4[1];
  var s5 = useState([]), eventos = s5[0], setEventos = s5[1];
  var s6 = useState(0), armado = s6[0], setArmado = s6[1];

  var A = useAgentes(token);
  var leer = A.leer;
  var sse = useStream(token, useCallback(function(ev){
    setEventos(function(L){ var n = L.concat([ev]); return n.length > 400 ? n.slice(-400) : n; });
  }, []));

  useEffect(function(){ leer(); }, [leer]);
  useEffect(function(){
    var t = setInterval(function(){
      if (!auto) return;
      setCuenta(function(c){ if (c <= 1) { leer(); return 15; } return c - 1; });
    }, 1000);
    return function(){ clearInterval(t); };
  }, [auto, leer]);

  function guardar(){
    var t = borr.trim();
    try { t ? localStorage.setItem("mcp_token", t) : localStorage.removeItem("mcp_token"); } catch(e){}
    setToken(t);
  }
  function parar(){
    if (Date.now() - armado > 4000) { setArmado(Date.now()); return; }
    setArmado(0);
    Promise.all(AGENTES.map(function(a){
      return fetch(a.url + "/kill", {method:"POST",
        headers:{Authorization:"Bearer " + token, "Content-Type":"application/json"},
        body:JSON.stringify({reason:"parada manual desde la torre de control"})})
        .catch(function(){});
    })).then(function(){ leer(); });
  }

  var alarmas = [], modos = [], vivo = false;
  AGENTES.forEach(function(a){
    var hh = A.datos[a.id] && A.datos[a.id].health;
    if (!hh) return;
    if (hh.killed) alarmas.push({n:a.nombre, m:hh.kill_reason || "kill switch activo"});
    else vivo = true;
    if (hh.mode && modos.indexOf(hh.mode) < 0) modos.push(hh.mode);
  });

  return html`<div class="wrap">
    <header>
      <div class="hd">
        <div class="brand"><h1>Torre de Control</h1>
          <span>${(modos.join(" / ") || "—")} · polymarket${A.ro ? " · solo lectura" : ""}</span>
        </div>
        <div class="hd-r">
          <span class="live"><span class=${"dot " + (vivo && auto ? "on" : "")}></span>
            ${auto ? "en " + cuenta + "s" : "pausado"}</span>
          <button class="btn" type="button"
            onClick=${function(){ setCuenta(15); leer(); }}>Actualizar</button>
          <button class="btn" type="button" aria-pressed=${auto}
            onClick=${function(){ setAuto(!auto); setCuenta(15); }}>
            ${auto ? "Auto 15s" : "Auto apagado"}</button>
          ${(!A.ro && token)
            ? html`<button class="btn danger" type="button" onClick=${parar}>
                ${Date.now() - armado < 4000 ? "¿Seguro? toca otra vez" : "Parar todo"}</button>`
            : null}
        </div>
      </div>
    </header>

    ${!token ? html`<div class="key">
      <p><b>Pega el token del agente</b> para ver el detalle. Queda solo en este navegador.</p>
      <input type="password" placeholder="AGENT_API_TOKEN" autocomplete="off" spellcheck="false"
        value=${borr} onInput=${function(e){ setBorr(e.target.value); }}
        onKeyDown=${function(e){ if (e.key === "Enter") guardar(); }} />
      <button class="btn" type="button" onClick=${guardar}>Guardar</button>
    </div>` : null}

    ${alarmas.map(function(x){
      return html`<div class="alarma" key=${x.n}><strong>${x.n} detenido</strong>
        <p>${x.m}</p></div>`; })}

    <div class="grid g2">
      ${AGENTES.map(function(a){
        return html`<${TarjetaAgente} key=${a.id} a=${a} d=${A.datos[a.id]}
          hist=${A.hist[a.id] || []} token=${token} sse=${sse[a.id]} />`; })}
    </div>

    <div class="grid">
      <${Feed} eventos=${eventos} token=${token} sse=${sse} />
      <${Diagnostico} datos=${A.datos} token=${token} />
      <${Mercados} datos=${A.datos} token=${token} />
      <${Geo} datos=${A.datos} token=${token} />
    </div>

    <footer>Render duerme el servicio a los 15 min sin trafico: la primera lectura
      puede tardar. Con esta pagina abierta se mantiene despierto.</footer>
  </div>`;
}

render(html`<${App} />`, document.getElementById("app"));
</script>
</body>
</html>
