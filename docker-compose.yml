#   docker compose up -d
#   docker compose logs -f agent
#
# Primer arranque: Ollama descarga el modelo (5-20 GB). Queda en
# ./ollama_data y no se vuelve a bajar.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mcptrade-ollama
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes: ["./ollama_data:/root/.ollama"]
    environment:
      # Sin esto Ollama descarga el modelo a los 5 minutos y la siguiente
      # llamada vuelve a pagar la carga entera, que en CPU son minutos.
      OLLAMA_KEEP_ALIVE: "-1"
      # En CPU dos peticiones a la vez se pelean los núcleos y las dos
      # tardan el doble. Con GPU se puede subir a 2-4.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    entrypoint: >
      sh -c "ollama serve &
             sleep 8 &&
             ollama pull ${OLLAMA_MODEL:-deepseek-r1:8b} &&
             wait"
    # Descomenta con GPU NVIDIA: el pronóstico pasa de ~60 s a ~6 s.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  searxng:
    image: searxng/searxng:latest
    container_name: mcptrade-searxng
    restart: unless-stopped
    ports: ["8888:8080"]
    volumes: ["./searxng:/etc/searxng"]
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-cambia-esto-por-algo-aleatorio}
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]

  agent:
    build: .
    container_name: mcptrade-agent
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 10000
      LOCAL_MODE: "true"
      OLLAMA_HOST: http://ollama:11434
      SEARXNG_HOST: http://searxng:8080
      # Sin valor por defecto: si falta, compose falla antes de levantar
      # nada en vez de arrancar contra una base que no existe.
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL (cadena de Neon) en el .env}
      VAULT_DIR: /vault
    ports: ["10000:10000"]
    volumes:
      - ./vault:/vault
      # El kill switch sobrevive reinicios del contenedor.
      - ./state:/app/state
    depends_on:
      ollama:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: mcptrade-n8n
    restart: unless-stopped
    ports: ["5678:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      DB_TYPE: sqlite
      # Con el agente nativo: AGENT_URL=http://host.docker.internal:10000
      AGENT_URL: ${AGENT_URL:-http://agent:10000}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./vault:/vault
      # Para importar por CLI sin pasar por la UI:
      #   docker compose exec n8n n8n import:workflow --separate --input=/workflows
      - ./n8n:/workflows:ro
